name: backend

on:
  push:
    branches: [ dev, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}-v1
        restore-keys: |
          ${{ runner.os }}-pip-
    - uses: actions/cache@v4
      with:
        path: ${{ env.pythonLocation }}
        key: ${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements.txt') }}-v2
    - name: Install system dependencies
      run: |
        sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get -qq update && \
        sudo apt-get -yqq install \
          gcc \
          libpq-dev \
          gdal-bin \
          libgdal-dev \
          libgeos-dev \
          postgresql-client
    - name: Install Python dependencies
      # The runner's toolcache pip (26.x) ships a broken vendored resolvelib —
      # `ImportError: cannot import name 'RequirementInformation' from
      # pip._vendor.resolvelib.structs` — so ANY `pip`/`python -m pip` command
      # aborts at import, including `pip install "pip<24.1"` (it can't run to
      # downgrade itself), and `ensurepip --upgrade` is a no-op because the broken
      # pip is *newer* than the stdlib-bundled wheel. Bootstrap a clean pip < 24.1
      # with get-pip.py, which runs its own zip-bundled pip and never imports the
      # broken one. Pin < 24.1 because a build-isolation path in `pip install -r
      # requirements.txt` still imports get_runnable_pip, which 24.1 removed.
      # (The pythonLocation cache above, bumped v1 -> v2, also caches pip, so a
      # cache hit can mask this; get-pip.py fixes the cache-miss base pip too.)
      run: |
        curl -fsS https://bootstrap.pypa.io/pip/get-pip.py -o /tmp/get-pip.py
        python /tmp/get-pip.py "pip<24.1"
        python -m pip install -r requirements.txt

  test:
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        group: [1, 2, 3]
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exact${{ matrix.group }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: actions/cache@v4
      with:
        path: ${{ env.pythonLocation }}
        key: ${{ runner.os }}-${{ env.pythonLocation }}-${{ hashFiles('requirements.txt') }}-v2
    - name: Install system dependencies
      run: |
        sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
        sudo apt-get -qq update && \
        sudo apt-get -yqq install \
          gcc \
          libpq-dev \
          gdal-bin \
          libgdal-dev \
          libgeos-dev \
          libgeos-c1v5 \
          postgresql-client
    - name: Set environment
      run: |
        echo "SECRET_KEY=ci-secret-key-not-used-in-prod" >> $GITHUB_ENV
        echo "DEBUG=false" >> $GITHUB_ENV
        echo "DATABASE_NAME=exact${{ matrix.group }}" >> $GITHUB_ENV
        echo "DATABASE_USER=postgres" >> $GITHUB_ENV
        echo "DATABASE_PASSWORD=postgres" >> $GITHUB_ENV
        echo "DATABASE_HOST=localhost" >> $GITHUB_ENV
        echo "DATABASE_PORT=5432" >> $GITHUB_ENV
    - name: Check for missing migrations
      run: python manage.py makemigrations --check
    - name: Run migrations
      run: python manage.py migrate
    - name: Run tests
      run: python -m pytest --splits 3 --group ${{ matrix.group }}
