name: frontend

on:
  push:
    branches: [dev, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires Node ^20.19 || >=22.12; pin 22 so the floor is
          # explicit (a bare "20" could resolve to a <20.19 cache and fail
          # with a cryptic `styleText` error).
          node-version: "22"
      - name: Install
        # Scaffold ships without a lockfile — fall back to `npm install`
        # on first run; subsequent PRs that touch package.json should
        # commit the resulting `frontend/package-lock.json` and add
        # `cache: "npm"` + `cache-dependency-path: frontend/package-lock.json`
        # to the setup-node step above.
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build remote
        run: npm run build
