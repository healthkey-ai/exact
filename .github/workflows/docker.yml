name: docker

on:
  push:
    # `harvard/**` is the pinned deployment line for the Harvard install: it
    # tracks main plus the catalog-schema alignment, and is deliberately NOT
    # merged into main (see the branch's commits). Building it here means the
    # image that install runs comes out of CI like any other, instead of being
    # built by hand on someone's laptop.
    branches: [dev, main, 'harvard/**']
    tags: ['*']

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKER_IMAGE }}
        tags: |
          type=sha,format=long
          type=ref,event=branch
          type=ref,event=tag
          # NOT `{{is_default_branch}}`: metadata-action counts a tag push as
          # coming from the default branch, so tagging any other line moves
          # :latest onto it. That is what happened with harvard-2026-08-14 —
          # a tag cut from harvard/**, which is deliberately never merged into
          # main — and :latest silently started serving the Harvard build.
          # :latest must mean "current main" and nothing else.
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
