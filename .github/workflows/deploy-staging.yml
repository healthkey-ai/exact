name: deploy-staging

# Keyless (Workload Identity Federation) build + blue-green deploy to the
# shared staging GCP project: build the image into Artifact Registry, run
# migrations in the dedicated Cloud Run job, roll out a no-traffic revision,
# then switch traffic.
#
# Migrations run BEFORE the revision is created. `--no-traffic` only withholds
# requests: Cloud Run still starts the new revision and waits for it to become
# ready, so `gcloud run deploy` fails if the container exits on startup.
#
# Why that matters for the trials DB: the service's own entrypoint `migrate`
# only ever migrates `default` (exact.db_router.allow_migrate keeps the trials
# app off it), so the trials copy is migrated solely by the job's second pass
# below. From the 2omop promotion (#226) on, the entrypoint runs
# `check_trials_schema` before gunicorn and exits when the image models a
# trials column the catalog does not have yet, so a revision carrying a trials
# schema change cannot start before that pass has run.
#
# Necessary but not sufficient: the same entrypoint refuses to start at all
# while the SERVICE env carries TRIALS_DB_MIGRATE (or the other split-DB
# write/tolerance flags). That flag must live on the migrate job only, which
# needs a job-only env input in the shared ht-phr `cloud_run` Terraform module;
# this workflow cannot do it.
#
# The cost of this order: if the new image cannot start, its migrations have
# already been applied while the previous revision keeps serving. The old
# revision serves throughout the job in both orders, so migrations must stay
# backward-compatible with it either way. From #226 on that is strict: every
# start of the old revision (staging scales to zero, so cold starts are
# routine) re-runs its own schema check, which wants each modeled column's
# exact type, typmod and nullability. Relaxing NOT NULL or widening a column
# is therefore not backward-compatible for the old revision.
#
# Env/secret wiring for both the service and the migrate job lives in the
# staging infra Terraform; this workflow only swaps the container image and
# orchestrates the rollout.
#
# Required GitHub Actions repository variables:
#   GCP_PROJECT_ID               shared project id
#   GCP_REGION                   e.g. us-central1
#   GCP_AR_REPO                  Artifact Registry repository id holding the exact image
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/.../providers/...
#   GCP_SERVICE_ACCOUNT          exact-staging-gh@<project>.iam.gserviceaccount.com

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVICE: exact-staging
      MIGRATE_JOB: exact-staging-migrate
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/exact
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "$REGISTRY" --quiet

      - name: Build and push image
        run: |
          docker build --platform linux/amd64 --provenance=false -f Dockerfile.gcp \
            -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Run database migrations
        run: |
          gcloud run jobs update "$MIGRATE_JOB" \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION"
          gcloud run jobs execute "$MIGRATE_JOB" \
            --region "$REGION" \
            --wait
          # Second pass migrates the split trials DB. The migrate_trials_db
          # command self-gates on settings.TRIALS_DB_MIGRATE inside the
          # container: a no-op (returns before opening the 'trials' connection)
          # unless the flag is on, so an externally-managed/read-only trials DB
          # is never touched and its django_migrations recorder is never
          # created. When on (a copy we own, e.g. staging) it applies each
          # pending trials migration to the 'trials' alias, and fakes one only
          # when it fails with DuplicateTable/DuplicateColumn, i.e. when the
          # seeded copy already has that schema.
          gcloud run jobs execute "$MIGRATE_JOB" \
            --region "$REGION" \
            --wait \
            --args=manage.py,migrate_trials_db

      - name: Deploy new revision (no traffic)
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" \
            --no-traffic

      - name: Route traffic to new revision
        run: |
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" \
            --to-latest
