services:

  db:
    image: postgis/postgis:16-3.5
    platform: linux/amd64   # official image has no arm64 build; Rosetta handles this on Apple Silicon
    environment:
      POSTGRES_DB: exact
      POSTGRES_USER: exact
      POSTGRES_PASSWORD: exact
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exact -d exact"]
      interval: 5s
      timeout: 5s
      retries: 15

  exact:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Explicit, because `.env` is optional above and this gate reads
      # ENVIRONMENT via os.environ.get so an unset value counts as *deployed*
      # and fails closed — without it, `docker compose up` on a fresh clone has
      # no working credential against the portal's HS256 dev deployment.
      #
      # This flag rather than `ENVIRONMENT: local`, which would also flip
      # EXACT_ALLOW_PERSON_ID_LOOKUP on — a gate deliberately closed for
      # #150/#108, since the `?person_id=` resolver reads from PROMOP under a
      # static service token not bound to the caller. Keeping the blast radius
      # to the one gate that needs opening.
      #
      # Only for the no-.env case, to be clear: docs/setup.md has you copy
      # .env.example, which sets ENVIRONMENT=local, and compose loads .env — so
      # a developer who followed the setup has that gate open anyway. Closing it
      # for local dev is a separate job than this file.
      PHR_ALLOW_INTROSPECTION: "true"
      DATABASE_HOST: db
      DATABASE_NAME: exact
      DATABASE_USER: exact
      DATABASE_PASSWORD: exact
      DATABASE_PORT: "5432"
      # The portal is the only identity provider locally — no Firebase here,
      # so listing it would only log "no credentials configured".
      PARTNER_AUTH_PROVIDERS: accounts.providers.phr.PhrTokenProvider
      # Verifies portal-issued tokens against a portal running on the host.
      PHR_BASE_URL: http://host.docker.internal:8000
      # Allow-all rather than a pinned origin list: vite moves to 5174, 5175…
      # whenever the previous port is taken, and a pinned list looks correct
      # right up until it blocks the portal's preflight. Deployments set the
      # real list.
      CORS_ALLOW_ALL_ORIGINS: "true"
      MALLOC_NANO_ZONE: "0"
      PORT: "${PORT:-8000}"
    volumes:
      - /tmp:/tmp
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["sh", "-c", "gunicorn exact.wsgi --workers 2 --timeout 300 --log-file - --bind 0.0.0.0:${PORT:-8000}"]
    ports:
      - "${PORT:-8000}:${PORT:-8000}"

volumes:
  db_data:
