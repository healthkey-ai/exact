services:

  db:
    image: postgis/postgis:16-3.5
    platform: linux/amd64   # official image has no arm64 build; Rosetta handles this on Apple Silicon
    environment:
      POSTGRES_DB: exact
      POSTGRES_USER: exact
      POSTGRES_PASSWORD: exact
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exact -d exact"]
      interval: 5s
      timeout: 5s
      retries: 15

  exact:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_HOST: db
      DATABASE_NAME: exact
      DATABASE_USER: exact
      DATABASE_PASSWORD: exact
      DATABASE_PORT: "5432"
      # The portal is the only identity provider locally — no Firebase here,
      # so listing it would only log "no credentials configured".
      PARTNER_AUTH_PROVIDERS: accounts.providers.phr.PhrTokenProvider
      # Verifies portal-issued tokens against a portal running on the host.
      PHR_BASE_URL: http://host.docker.internal:8000
      # Local dev may run the portal on its HS256 key; opt in to introspection
      # explicitly (it is no longer auto-derived from PHR_BASE_URL, so a public
      # RS256 deployment has no unauthenticated introspection surface). Harmless
      # when the portal issues RS256 — those tokens verify offline via JWKS and
      # never reach this endpoint.
      PHR_INTROSPECT_URL: http://host.docker.internal:8000/api/v1/auth/introspect/
      # Allow-all rather than a pinned origin list: vite moves to 5174, 5175…
      # whenever the previous port is taken, and a pinned list looks correct
      # right up until it blocks the portal's preflight. Deployments set the
      # real list.
      CORS_ALLOW_ALL_ORIGINS: "true"
      MALLOC_NANO_ZONE: "0"
      PORT: "${PORT:-8000}"
    volumes:
      - /tmp:/tmp
    entrypoint: ["/app/docker/entrypoint.sh"]
    command: ["sh", "-c", "gunicorn exact.wsgi --workers 2 --timeout 300 --log-file - --bind 0.0.0.0:${PORT:-8000}"]
    ports:
      - "${PORT:-8000}:${PORT:-8000}"

volumes:
  db_data:
